<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Studio | Memories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #e6e6e6;
            --accent-color: #c5a47e;
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 90%;
            max-width: 600px;
            aspect-ratio: 4/5;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            z-index: 2;
        }

        .under-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            z-index: 1;
        }

        .under-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .watermark-left {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: var(--text-color);
            z-index: 3;
            pointer-events: none;
            opacity: 0.8;
        }

        .watermark-right {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-family: var(--font-serif);
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: var(--accent-color);
            z-index: 3;
            pointer-events: none;
            opacity: 0.8;
        }

        .instructions {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            z-index: 4;
            pointer-events: none;
            animation: fadeInOut 3s infinite ease-in-out;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        #revealed-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            text-align: center;
            width: 80%;
        }

        #revealed-message h2 {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            font-weight: 400;
            color: #ffffff;
            margin: 0;
            letter-spacing: 2px;
        }

        #revealed-message p {
            font-size: 1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-top: 10px;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="watermark-left">Pardo Domínguez</div>
        <div class="watermark-right">May 2027</div>

        <div id="revealed-message">
            <h2>Can't wait to meet you!</h2>
            <p>Due Date: May 2027</p>
        </div>

        <div class="under-image">
            <img src="image1.jpeg" alt="Background">
        </div>
        <canvas id="scratch-off"></canvas>
        <div class="instructions">Scratch to reveal</div>
    </div>

    <script>
        const canvas = document.getElementById('scratch-off');
        const ctx = canvas.getContext('2d');
        const container = document.querySelector('.container');
        const revealedMessage = document.getElementById('revealed-message');

        function resize() {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
            init();
        }

        function init() {
            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#141414';
            ctx.fillRect(5, 5, canvas.width - 10, canvas.height - 10);

            ctx.fillStyle = '#c5a47e';
            ctx.font = `300 16px Inter`;
            ctx.textAlign = 'center';
            ctx.fillText("LUMINA STUDIO", canvas.width / 2, canvas.height / 2);

            ctx.globalCompositeOperation = 'destination-out';
        }

        let isDrawing = false;

        function scratch(e) {
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            let x, y;

            if (e.touches) {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            } else {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }

            ctx.beginPath();
            ctx.arc(x, y, 25, 0, Math.PI * 2);
            ctx.fill();

            checkProgress();
        }

        let totalPixels = 0;
        let clearedPixels = 0;

        function checkProgress() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            totalPixels = canvas.width * canvas.height;
            clearedPixels = 0;

            for (let i = 3; i < data.length; i += 4) {
                if (data[i] === 0) {
                    clearedPixels++;
                }
            }

            const percentage = (clearedPixels / totalPixels) * 100;

            if (percentage > 45) {
                canvas.style.transition = 'opacity 1s';
                canvas.style.opacity = '0';
                revealedMessage.style.opacity = '1';
                setTimeout(() => canvas.remove(), 1000);
            }
        }

        canvas.addEventListener('mousedown', () => isDrawing = true);
        window.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', scratch);

        canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
        window.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('touchmove', scratch);

        window.addEventListener('resize', resize);
        resize();
    </script>
</body>
</html>
